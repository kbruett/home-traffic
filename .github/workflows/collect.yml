name: collect-traffic

on:
  schedule:
    # Off-peak minutes: GitHub delays/skips jobs on :00/:10/:20 slots.
    # Each run takes 3 samples 10 minutes apart, so two triggers per hour give a 10-minute cadence.
    - cron: "7,37 * * * *"
  workflow_dispatch:          # run by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Sample 3 times, 10 minutes apart
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          LOCATION: ${{ secrets.LOCATION }}
        run: |
          git config user.name "traffic-bot"
          git config user.email "traffic-bot@users.noreply.github.com"
          for i in 1 2 3; do
            python3 collect.py || echo "sample failed"
            git add data/traffic_log.csv
            git diff --cached --quiet || { git commit -q -m "sample"; git pull --rebase -q; git push -q; }
            [ "$i" -lt 3 ] && sleep 600
          done
