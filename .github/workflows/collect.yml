name: collect-traffic

# Each run samples every 10 minutes for ~5.5 hours, then starts the next run itself,
# so it does not depend on GitHub's unreliable scheduler. The cron line is only a
# backup restart in case the chain is ever broken (concurrency prevents overlap).
on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Sample every 10 minutes for ~5.5 hours
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          LOCATION: ${{ secrets.LOCATION }}
        run: |
          git config user.name "traffic-bot"
          git config user.email "traffic-bot@users.noreply.github.com"
          for i in $(seq 1 33); do
            start=$(date +%s)
            python3 collect.py || echo "sample failed"
            git add data/
            git diff --cached --quiet || { git commit -q -m "sample"; git pull --rebase -q; git push -q; }
            [ "$i" -lt 33 ] || break
            elapsed=$(( $(date +%s) - start ))
            [ "$elapsed" -lt 600 ] && sleep $(( 600 - elapsed ))
          done

      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
