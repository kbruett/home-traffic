name: collect-traffic

on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub may run this a few minutes late
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Take a sample
        run: python3 collect.py
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          LOCATION: ${{ secrets.LOCATION }}

      - name: Save it
        run: |
          git config user.name "traffic-bot"
          git config user.email "traffic-bot@users.noreply.github.com"
          git add data/traffic_log.csv
          git diff --cached --quiet || { git commit -m "sample"; git pull --rebase -q; git push; }
