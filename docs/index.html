<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Home Traffic</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" id="touch-icon">
<meta name="theme-color" content="#d9541e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Traffic">
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1b;--mute:#6b6b66;--line:#e4e2dc;--a:#d9541e;--b:#2b6cb0;--c:#2f8f5b}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--card:#201f1e;--ink:#eeece7;--mute:#9a9892;--line:#33312f;--a:#ff8a57;--b:#6aa9ec;--c:#58c28a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,system-ui,Segoe UI,sans-serif}
main{max-width:1000px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 16px 48px}
h1{font-size:20px;margin:0}.sub{color:var(--mute);font-size:13px;margin:2px 0 14px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 0 14px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.tabs button,.seg button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 13px;border-radius:99px;white-space:nowrap;cursor:pointer}
.tabs button.on,.seg button.on{background:var(--a);border-color:var(--a);color:#fff;font-weight:600}
.seg{display:flex;gap:6px;margin:0 0 10px;flex-wrap:wrap}.seg button{padding:5px 11px}
.grid{display:grid;gap:12px}.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.k{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.v{font-size:26px;font-weight:650;margin-top:2px}.s{color:var(--mute);font-size:12px;margin-top:2px}
h2{font-size:15px;margin:0 0 10px}section{margin-top:14px}
.hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.pill{font-weight:650;padding:3px 10px;border-radius:99px;font-size:13px;color:#fff;display:inline-block}
.heat{display:grid;grid-template-columns:34px repeat(24,minmax(0,1fr));gap:2px;font-size:10px}
.heat div{aspect-ratio:1.25;border-radius:3px;display:flex;align-items:center;justify-content:center}
.heat .lab{color:var(--mute);aspect-ratio:auto;justify-content:flex-start;min-width:0;white-space:nowrap;overflow:visible}
.legend{display:flex;gap:8px;align-items:center;color:var(--mute);font-size:11px;margin-top:8px}
.legend i{display:inline-block;width:90px;height:8px;border-radius:4px;background:linear-gradient(90deg,rgba(217,84,30,.06),rgba(217,84,30,1))}
.bars .row{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px}
.bars .row b{width:32px;font-weight:500}.bars .track{flex:1;height:14px;background:var(--line);border-radius:7px;overflow:hidden}
.bars .fill{height:100%;background:var(--a)}.bars .n{width:48px;text-align:right;color:var(--mute)}
svg{width:100%;height:auto;display:block}svg text{fill:var(--mute);font-size:10px}
.two{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.key{display:flex;gap:14px;font-size:12px;color:var(--mute);margin-bottom:6px;flex-wrap:wrap}.key i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.place h2{font-size:17px;margin:0}.place .addr{color:var(--mute);font-size:13px;margin:2px 0 10px}
.place iframe{width:100%;height:230px;border:1px solid var(--line);border-radius:10px;display:block;background:var(--line)}
.links{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:13px}.links a{color:var(--b);text-decoration:none}
.warn{background:rgba(212,154,18,.14);border:1px solid rgba(212,154,18,.5);border-radius:8px;padding:8px 10px;font-size:12px;margin-top:10px}
#incidents{margin:0 0 12px;display:grid;gap:8px}
.inc{border-radius:10px;padding:9px 12px;font-size:13px;border:1px solid var(--line);background:var(--card);display:flex;gap:10px;align-items:flex-start}
.inc b{font-weight:650}.inc .tag{color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.04em;display:block}
.inc.sev3{background:rgba(201,58,43,.12);border-color:rgba(201,58,43,.55)}.inc.sev2{background:rgba(212,154,18,.14);border-color:rgba(212,154,18,.5)}
.inc.ok{color:var(--mute);background:transparent;border-style:dashed}
.roads{font-size:13px;margin-top:8px}
#empty{display:none;text-align:center;padding:60px 0;color:var(--mute)}
</style></head><body><main>
<h1>Home traffic</h1>
<div class="sub" id="sub">Loading&hellip;</div>
<div id="incidents"></div>
<nav class="tabs" id="tabs"></nav>
<div id="empty">No data yet. The first sample appears within about 10 minutes of the collector starting.</div>
<div id="panel"></div>
</main>
<script src="stats.js"></script>
<script>
// Home-screen icon drawn at load time (orange tile, road, dashed centre line)
try{const c=document.createElement('canvas');c.width=c.height=180;const g=c.getContext('2d');
 g.fillStyle='#d9541e';g.fillRect(0,0,180,180);g.fillStyle='#2d2d2b';g.fillRect(65,0,50,180);
 g.fillStyle='#fff';for(let y=14;y<170;y+=34)g.fillRect(87,y,6,17);
 document.getElementById('touch-icon').href=c.toDataURL('image/png')}catch(e){}

const $=id=>document.getElementById(id), fmtH=h=>h===0?'12 AM':h<12?h+' AM':h===12?'12 PM':(h-12)+' PM';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const level=c=>c<10?['Free flowing','#2f8f5b']:c<25?['Light traffic','#8a9a1f']:c<45?['Moderate','#d49a12']:['Heavy','#c93a2b'];
const dur=s=>s==null?'-':s<90?Math.round(s)+' sec':(s/60).toFixed(1)+' min';
function kpi(k,v,s){return `<div class="card"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s||''}</div></div>`}
function ago(m){return m<2?'just now':m<90?m+' min ago':Math.round(m/60)+' hr ago'}
function cmpText(n){
  if(n.typical!=null&&n.typical_n>=3){const diff=n.cong-n.typical;return (Math.abs(diff)<3?'About typical for this time':(diff>0?`${Math.round(diff)} pts busier than usual`:`${Math.round(-diff)} pts quieter than usual`))+` (${n.typical_n} past samples)`}
  return 'Not enough history for this time slot yet';
}
function line(series,labels,h=170){
  const W=600,H=h,L=30,B=18,T=6,R=6,all=series.flatMap(s=>s.v).filter(x=>x!=null),max=Math.max(5,Math.ceil(Math.max(...all,0)/5)*5);
  const x=i=>L+(W-L-R)*i/Math.max(1,labels.length-1),y=v=>T+(H-T-B)*(1-v/max);
  let o=`<svg viewBox="0 0 ${W} ${H}">`;
  for(let i=0;i<=4;i++){const v=max*i/4;o+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-4}" y="${y(v)+3}" text-anchor="end">${Math.round(v)}%</text>`}
  const step=Math.ceil(labels.length/8);labels.forEach((l,i)=>{if(i%step===0)o+=`<text x="${x(i)}" y="${H-4}" text-anchor="middle">${l}</text>`});
  series.forEach(s=>{let d='',pen=false;s.v.forEach((v,i)=>{if(v==null){pen=false;return}d+=(pen?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1);pen=true});o+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round"/>`});
  return o+'</svg>';
}
function heatHTML(d){
  const flat=d.heat.flat().filter(v=>v!=null),max=Math.max(1,...flat);let h='<div class="heat"><div class="lab"></div>';
  for(let i=0;i<24;i++)h+=`<div class="lab" style="justify-content:center">${i%3===0?(i%12||12):''}</div>`;
  d.heat.forEach((row,di)=>{h+=`<div class="lab">${d.days[di]}</div>`;row.forEach((v,i)=>{const c=d.counts[di][i];
    h+=v==null?`<div style="background:var(--line);opacity:.4"></div>`:`<div title="${d.days[di]} ${fmtH(i)}: ${v}% (${c} samples)" style="background:rgba(217,84,30,${(0.06+0.94*v/max).toFixed(2)});opacity:${c<3?.55:1}"></div>`})});
  return h+'</div><div class="legend">0% <i></i> busiest slot &middot; faint cells have few samples</div>';
}
function dowHTML(d){
  const dm=Math.max(1,...d.dow.filter(v=>v!=null));
  return '<div class="bars">'+d.dow.map((v,i)=>`<div class="row"><b>${d.days[i]}</b><div class="track"><div class="fill" style="width:${v==null?0:100*v/dm}%"></div></div><span class="n">${v==null?'-':v.toFixed(0)+'%'}</span></div>`).join('')+'</div>';
}
function seg(group,opts,cur){return `<div class="seg">`+opts.map(([k,l])=>`<button class="${k==cur?'on':''}" data-seg="${group}" data-val="${k}">${l}</button>`).join('')+'</div>'}

// ---------- state ----------
let DATA=null; const UI={tab:null,hourly:'weekday',heatDir:0,commute:null};
const todayIdx=()=>{const w=new Date().toLocaleDateString('en-US',{weekday:'short',timeZone:'America/New_York'});return ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].indexOf(w)};

// ---------- panels ----------
function homePanel(d){
  const n=d.now,s=d.stats,[lv,col]=level(n.cong),bh=s.busiest_hour,qh=s.quietest_hour;
  return `<div class="card hero"><div><div class="k">Latest</div><div class="v">${n.mph.toFixed(0)} mph</div><div class="s">free flow ${n.free.toFixed(0)} mph</div></div>
   <div><span class="pill" style="background:${col}">${lv}</span><div class="s" style="margin-top:6px">${n.cong.toFixed(0)}% congestion &middot; ${cmpText(n)}</div></div></div>
  <section class="grid kpis">${kpi('Busiest hour',bh?fmtH(bh[0]):'-',bh?bh[1].toFixed(0)+'% avg congestion':'')
   +kpi('Quietest hour',qh?fmtH(qh[0]):'-',qh?qh[1].toFixed(0)+'% avg congestion':'')
   +kpi('Busiest day',s.busiest_day?s.busiest_day[0]:'-',s.busiest_day?s.busiest_day[1].toFixed(0)+'% avg':'')
   +kpi('Quietest day',s.quietest_day?s.quietest_day[0]:'-',s.quietest_day?s.quietest_day[1].toFixed(0)+'% avg':'')
   +kpi('Average speed',s.avg_mph.toFixed(0)+' mph',s.avg_cong.toFixed(0)+'% avg congestion')
   +kpi('Worst recorded',s.worst_cong.toFixed(0)+'%','over '+s.days+' day'+(s.days>1?'s':''))}</section>
  <section class="card"><h2>Last 24 hours</h2>${line([{v:d.recent.map(r=>r.cong),c:'var(--a)'}],d.recent.map(r=>r.t))}</section>
  <section class="card"><h2>Congestion by day &amp; hour</h2>${heatHTML(d)}</section>
  <section class="grid two">
   <div class="card"><h2>Typical day (by hour)</h2><div class="key"><span><i style="background:var(--b)"></i>Weekday</span><span><i style="background:var(--c)"></i>Weekend</span></div>${line([{v:d.hourly.weekday,c:'var(--b)'},{v:d.hourly.weekend,c:'var(--c)'}],[...Array(24).keys()].map(i=>i%3===0?fmtH(i):''))}</div>
   <div class="card"><h2>By day of week</h2>${dowHTML(d)}</div></section>`;
}
function placePanel(pl,dirs){
  const lat=pl.lat,lon=pl.lon;
  const bbox=`${(lon-0.004).toFixed(5)},${(lat-0.0025).toFixed(5)},${(lon+0.004).toFixed(5)},${(lat+0.0025).toFixed(5)}`;
  const nm=pl.matched_name&&pl.matched_name!==pl.name?pl.matched_name+' \u00b7 ':'';
  const isC=pl.kind==='commute',DN=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const roads=(pl.roads||[]).map(r=>`${esc(r.name)} (${r.miles} mi)`).join(' \u2192 ');
  const win=(pl.windows||[]).map(([a,b])=>fmtH(a)+'\u2013'+fmtH(b)).join(' and ');
  const links=isC
   ?`<a target="_blank" rel="noopener" href="https://maps.apple.com/?daddr=${lat},${lon}&dirflg=d">Directions (Apple)</a>
   <a target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}&travelmode=driving">Directions (Google)</a>
   <a target="_blank" rel="noopener" href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${lat},${lon}">Street View</a>`
   :`<a target="_blank" rel="noopener" href="https://maps.apple.com/?ll=${lat},${lon}&q=${encodeURIComponent(pl.name)}">Apple Maps</a>
   <a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${lat},${lon}">Google Maps</a>
   <a target="_blank" rel="noopener" href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${lat},${lon}">Street View</a>`;
  const blurb=isC
   ?`<div class="roads"><b>Usual route:</b> ${roads||'not available yet'}${pl.route_miles?` \u00b7 ${pl.route_miles} mi`:''}</div>
     <div class="s" style="margin-top:6px">Timed each way between home and this office, live traffic. Measured only on ${(pl.days||[]).map(d=>DN[d]).join(' & ')} during ${esc(win)}.</div>`
   :`<div class="s" style="margin-top:8px">Measures a ~${Math.round(pl.span_m*2)} m stretch of ${esc(pl.road||'road')} through this point, timed each way with live traffic.</div>
   ${pl.road_matched?'':'<div class="warn">Heads-up: I couldn\'t confirm the measured road is '+esc(pl.road)+' (nearest road found: '+esc(pl.road_street||'unknown')+'). Compare the numbers with what you see in person.</div>'}`;
  let h=`<div class="card place"><h2>${esc(pl.name)}</h2><div class="addr">${esc(nm+(pl.matched_address||pl.query))}</div>
   <iframe loading="lazy" title="Map of ${esc(pl.name)}" src="https://www.openstreetmap.org/export/embed.html?bbox=${bbox}&layer=mapnik&marker=${lat},${lon}"></iframe>
   <div class="links">${links}</div>${blurb}
  </div>`;
  const live=dirs.filter(x=>!x.built.empty);
  if(!live.length)return h+'<section class="card"><div class="s">No samples for this place yet.</div></section>';
  h+='<section class="grid two">'+live.map(x=>{
    const n=x.built.now,[lv,col]=level(n.cong),bh=x.built.stats.busiest_hour_weekday,delay=(n.travel_s!=null&&n.free_s!=null)?Math.max(0,n.travel_s-n.free_s):null;
    const typ=n.typical_travel_s!=null&&n.typical_n>=3?` · usually ${dur(n.typical_travel_s)} at this hour`:'';
    return `<div class="card"><div class="k">${esc(x.label)}</div><div class="v">${dur(n.travel_s)}</div>
     <div style="margin-top:4px"><span class="pill" style="background:${col}">${lv}</span></div>
     <div class="s" style="margin-top:6px">${delay!=null?'+'+dur(delay)+' vs free flow':n.cong.toFixed(0)+'% congestion'}${typ}</div>
     <div class="s">${cmpText(n)}</div>
     <div class="s">${bh?`Weekday rush: ${fmtH(bh[0])} (${bh[1].toFixed(0)}% avg)`:''} &middot; updated ${ago(n.age_min)}</div></div>`}).join('')+'</section>';
  const colors=['var(--a)','var(--b)'],key='<div class="key">'+live.map((x,i)=>`<span><i style="background:${colors[i]}"></i>${esc(x.label)}</span>`).join('')+'</div>';
  const tsAll=[...new Set(live.flatMap(x=>x.built.recent.map(r=>r.ts)))].sort();
  const recent=live.map((x,i)=>{const m=Object.fromEntries(x.built.recent.map(r=>[r.ts,r.cong]));return{v:tsAll.map(t=>m[t]??null),c:colors[i]}});
  h+=`<section class="card"><h2>Last 24 hours</h2>${key}${line(recent,tsAll.map(t=>t.substring(11,16)))}<div class="s">% slower than free flow</div></section>`;
  h+=`<section class="card"><h2>Typical day (by hour)</h2>${seg('hourly',[['weekday','Weekday'],['weekend','Weekend'],['all','All days']],UI.hourly)}${key}${line(live.map((x,i)=>({v:x.built.hourly[UI.hourly],c:colors[i]})),[...Array(24).keys()].map(i=>i%3===0?fmtH(i):''))}</section>`;
  const hd=Math.min(UI.heatDir,live.length-1);
  h+=`<section class="card"><h2>Congestion by day &amp; hour</h2>${live.length>1?seg('heatDir',live.map((x,i)=>[i,x.label]),hd):''}${heatHTML(live[hd].built)}</section>`;
  return h;
}

// ---------- incidents ----------
function incidentsHTML(){
  const inc=DATA.incidents; if(!inc)return '';
  const age=DATA.home&&!DATA.home.empty?DATA.home.now.age_min:null;
  if(age!=null&&age>45)return '';           // collector looks stalled; don't show stale incidents
  const t=todayIdx(),scopes=['home'];
  DATA.places.filter(p=>p.pl.kind==='commute'&&p.pl.days.includes(t)).forEach(p=>scopes.push(p.pl.id));
  const items=[];
  scopes.forEach(id=>{const sc=inc[id];if(sc)sc.items.forEach(i=>items.push({...i,scope:sc.label}))});
  if(!items.length)return `<div class="inc ok">No incidents reported near home${scopes.length>1?' or on today\'s commute':''}.</div>`;
  const seen=new Set();
  return items.filter(i=>{const k=i.id+i.scope;if(seen.has(k))return false;seen.add(k);return true}).slice(0,6).map(i=>{
    const where=[i.roads&&i.roads.length?i.roads.join(', '):'',i.from?(i.to?i.from+' \u2192 '+i.to:i.from):''].filter(Boolean).join(' \u00b7 ');
    const sev=i.severity>=3?'sev3':'sev2';
    return `<div class="inc ${sev}"><div style="font-size:16px">${i.severity>=3?'\u26a0\ufe0f':'\u26a0'}</div><div><span class="tag">${esc(i.scope)}</span><b>${esc(i.category)}</b>${i.description&&i.description!==i.category?' \u2014 '+esc(i.description):''}${where?`<div class="s">${esc(where)}${i.delay_s>30?' \u00b7 +'+dur(i.delay_s)+' delay':''}</div>`:''}</div></div>`}).join('');
}

// ---------- render ----------
function render(){
  if(!DATA)return;
  const tabs=[];
  if(DATA.home&&!DATA.home.empty)tabs.push({id:'home',label:'My street'});
  DATA.places.filter(p=>p.pl.kind!=='commute').forEach(p=>tabs.push({id:p.pl.id,label:p.pl.name.replace(/ (at|by) .*$/,'')}));
  const commutes=DATA.places.filter(p=>p.pl.kind==='commute');
  if(commutes.length)tabs.push({id:'commute',label:'Commute'});
  if(!tabs.length){$('empty').style.display='block';$('tabs').innerHTML='';$('panel').innerHTML='';$('sub').textContent='Waiting for first sample';return}
  $('empty').style.display='none';
  $('incidents').innerHTML=incidentsHTML();
  if(!tabs.some(t=>t.id===UI.tab))UI.tab=tabs[0].id;
  $('tabs').innerHTML=tabs.length>1?tabs.map(t=>`<button class="${t.id===UI.tab?'on':''}" data-tab="${esc(t.id)}">${esc(t.label)}</button>`).join(''):'';
  let ageMin,count;
  if(UI.tab==='home'){const d=DATA.home;$('panel').innerHTML=homePanel(d);ageMin=d.now.age_min;count=d.stats.samples;
    $('sub').textContent=`${count.toLocaleString()} samples since ${d.stats.since} · last sample ${ago(ageMin)} · refreshes every minute`}
  else{let p,pre='';
    if(UI.tab==='commute'){
      if(!commutes.some(c=>c.pl.id===UI.commute)){const t=todayIdx();UI.commute=(commutes.find(c=>c.pl.days.includes(t))||commutes[0]).pl.id}
      p=commutes.find(c=>c.pl.id===UI.commute);const t=todayIdx();
      pre=seg('commute',commutes.map(c=>[c.pl.id,c.pl.short+(c.pl.days.includes(t)?' \u2022 today':'')]),UI.commute);
    } else p=DATA.places.find(x=>x.pl.id===UI.tab);
    $('panel').innerHTML=pre+placePanel(p.pl,p.dirs);
    const live=p.dirs.filter(x=>!x.built.empty);
    $('sub').textContent=live.length?`${live[0].built.stats.samples.toLocaleString()} samples each way since ${live[0].built.stats.since} · last sample ${ago(live[0].built.now.age_min)} · refreshes every minute`:'Waiting for first sample at this place'}
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]');if(t){UI.tab=t.dataset.tab;try{history.replaceState(null,'','#'+UI.tab)}catch(_){}render();return}
  const s=e.target.closest('[data-seg]');if(s){UI[s.dataset.seg]=s.dataset.seg==='heatDir'?+s.dataset.val:s.dataset.val;render()}
});

// ---------- data ----------
function base(){
  const m=location.hostname.match(/^(.+)\.github\.io$/),repo=location.pathname.split('/')[1];
  return m&&repo?`https://raw.githubusercontent.com/${m[1]}/${repo}/main/data/`:'../data/';
}
async function fetchText(name){
  const q=new URLSearchParams(location.search).get('data');
  const url=(q?q.replace(/[^/]*$/,''):base())+name;
  const res=await fetch(url+'?t='+Date.now(),{cache:'no-store'});
  if(res.status===404)return null;if(!res.ok)throw new Error(name+' '+res.status);return res.text();
}
async function load(){
  try{
    const [homeTxt,placeTxt,resTxt,incTxt]=await Promise.all([fetchText('traffic_log.csv'),fetchText('places_log.csv'),fetchText('places_resolved.json'),fetchText('incidents.json')]);
    const S=TrafficStats,home=homeTxt?S.build(S.parseCSV(homeTxt)):{empty:true};
    const resolved=resTxt?JSON.parse(resTxt):{},rows=placeTxt?S.parseCSV(placeTxt):[],places=[];
    for(const id of Object.keys(resolved)){
      const pl=resolved[id];
      places.push({pl,dirs:pl.directions.map(d=>({label:d.label,built:S.build(rows.filter(r=>r.place===id&&r.direction===d.label))}))});
    }
    DATA={home,places,incidents:incTxt?JSON.parse(incTxt):null};
    if(!UI.tab){const h=location.hash.slice(1);if(h)UI.tab=h}
    render();
  }catch(e){$('sub').textContent='Could not load data ('+e.message+')'}
}
load();setInterval(load,60000);
</script></body></html>
